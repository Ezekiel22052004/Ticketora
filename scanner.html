<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ticketora - Scanner</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/html5-qrcode" defer></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>input,textarea,select{color:#0f172a!important;background:#f8fafc!important}button{touch-action:manipulation}</style></head>
<body class="min-h-screen bg-[#07152f] text-white font-sans">
<div id="scanner-login" class="min-h-screen flex items-center justify-center p-5"><div class="w-full max-w-md bg-[#102341] border border-[#263d5e] rounded-3xl p-8 shadow-2xl"><div class="text-center mb-7"><img src="logo.png" class="w-16 h-16 mx-auto object-contain"><h1 class="text-2xl font-black mt-3">Ticketora <span class="text-[#ff8a00]">Scanner</span></h1><p class="text-sm text-slate-400 mt-1">Connexion de l’agent de contrôle</p></div><form id="scanner-login-form" class="space-y-4"><input id="scanner-number" required class="w-full rounded-xl px-4 py-3 font-mono uppercase" placeholder="Numéro scanner"><input id="scanner-password" required type="password" class="w-full rounded-xl px-4 py-3" placeholder="Mot de passe"><div id="scanner-login-msg" class="hidden text-sm rounded-xl p-3"></div><button class="w-full bg-[#ff8a00] hover:bg-orange-600 py-3 rounded-xl font-black">Se connecter</button></form></div></div>
<div id="scanner-app" class="hidden min-h-screen"><header class="h-20 bg-[#06132f] border-b border-[#1e3555] px-5 md:px-10 flex items-center justify-between"><div class="flex items-center gap-3"><img src="logo.png" class="w-11 h-11 object-contain"><div><div class="font-black text-xl">Ticket<span class="text-[#ff8a00]">ora</span></div><div id="scanner-agent-name" class="text-xs text-slate-400">Agent</div></div></div><button id="scanner-logout" class="border border-[#2b4263] px-4 py-2 rounded-xl text-sm font-bold hover:bg-[#102341]">Déconnexion</button></header><main class="max-w-3xl mx-auto p-5 md:p-10"><div class="text-center mb-7"><div class="inline-flex w-16 h-16 rounded-2xl bg-orange-500/10 text-[#ff8a00] items-center justify-center text-2xl"><i class="fa-solid fa-qrcode"></i></div><h2 class="text-3xl font-black mt-4">Valider un billet</h2><p class="text-slate-400 text-sm mt-2">Scannez le QR code ou saisissez le numéro du billet.</p></div><div class="grid md:grid-cols-2 gap-5"><div class="bg-white rounded-3xl p-5 text-slate-900 shadow-xl"><h3 class="font-black text-lg mb-4">Scanner le QR</h3><div id="qr-reader" class="overflow-hidden rounded-2xl"></div><button id="start-camera" class="mt-4 w-full bg-slate-900 text-white py-3 rounded-xl font-bold"><i class="fa-solid fa-camera mr-2"></i> Activer la caméra</button></div><div class="bg-[#102341] border border-[#263d5e] rounded-3xl p-6"><h3 class="font-black text-lg">Saisie manuelle</h3><input id="ticket-code" class="w-full mt-4 rounded-xl px-4 py-3 text-center font-mono font-black uppercase" placeholder="TKT-XXXXXXXXXX"><button id="validate-ticket" class="w-full mt-3 bg-[#ff8a00] py-3 rounded-xl font-black">Valider le billet</button><div id="scan-result" class="mt-5"></div></div></div></main></div>
<script src="config.js"></script><script>
const API=(window.TICKETORA_API_URL||'').replace(/\/$/,''),$=id=>document.getElementById(id);async function api(path,o={}){const r=await fetch(API+path,{credentials:'include',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||'Erreur serveur');return d}
function showLoginMsg(t,ok=false){const e=$('scanner-login-msg');e.textContent=t;e.className='text-sm rounded-xl p-3 '+(ok?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-700');}
async function login(e){e.preventDefault();try{const d=await api('/api/scanners/login',{method:'POST',body:JSON.stringify({number:$('scanner-number').value,password:$('scanner-password').value})});$('scanner-login').classList.add('hidden');$('scanner-app').classList.remove('hidden');$('scanner-agent-name').textContent=d.scanner.name+' • '+d.scanner.number;}catch(e){showLoginMsg(e.message)}}
async function validate(code){code=(code||$('ticket-code').value).trim().toUpperCase();if(!code)return;const r=$('scan-result');r.innerHTML='<div class="p-4 rounded-2xl bg-slate-800 text-slate-300">Vérification…</div>';try{const d=await api('/api/scanners/scan',{method:'POST',body:JSON.stringify({code})});r.innerHTML='<div class="p-5 rounded-2xl bg-emerald-100 text-emerald-800"><div class="text-2xl font-black">ENTRÉE AUTORISÉE ✅</div><div class="font-bold mt-2">'+(d.ticket?.customer_name||'Billet valide')+'</div><div class="text-sm mt-1">'+(d.ticket?.event_title||'')+'</div><div class="font-mono text-xs mt-2">'+code+'</div></div>';$('ticket-code').value='';}catch(e){r.innerHTML='<div class="p-5 rounded-2xl bg-rose-100 text-rose-800"><div class="text-2xl font-black">BILLET NON VALIDE ❌</div><div class="font-semibold mt-2">'+e.message+'</div></div>';}}
let qr=null;$('scanner-login-form').addEventListener('submit',login);$('validate-ticket').addEventListener('click',()=>validate());$('ticket-code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();validate()}});$('scanner-logout').addEventListener('click',async()=>{await api('/api/scanners/logout',{method:'POST'});location.reload()});$('start-camera').addEventListener('click',async()=>{if(!window.Html5Qrcode)return alert('Le module caméra est encore en chargement. Réessayez.');if(qr)return;qr=new Html5Qrcode('qr-reader');try{await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},async text=>{await qr.stop();qr=null;validate(text)},()=>{});}catch(e){alert('Caméra indisponible. Utilisez la saisie manuelle.')}});
</script></body></html>
