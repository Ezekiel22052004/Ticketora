<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06132f">
<title>Ticketora — Scanner</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#f8fafc}
.tr-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,15,35,.62);backdrop-filter:blur(8px)}
.tr-card{width:min(430px,100%);background:#fff;border-radius:28px;padding:34px 28px 30px;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.25)}
.tr-stage{height:150px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tr-plane{position:absolute;width:88px;height:88px;left:50%;top:50%;transform:translate(-155px,58px) rotate(-12deg) scale(.72);opacity:0;animation:trPlane 1.15s cubic-bezier(.22,.8,.3,1) forwards}
.tr-plane svg{width:100%;height:100%;filter:drop-shadow(0 10px 10px rgba(0,0,0,.12))}
.tr-ring{position:absolute;width:92px;height:92px;border:5px solid #22c55e;border-radius:50%;opacity:0;transform:scale(.55);animation:trRing .45s 1.02s cubic-bezier(.2,.8,.2,1) forwards}
.tr-check{position:absolute;width:54px;height:54px;opacity:0;transform:scale(.65);animation:trCheck .45s 1.05s cubic-bezier(.2,.8,.2,1) forwards}
.tr-check path{fill:none;stroke:#22c55e;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:trCheckPath .38s 1.12s ease forwards}
.tr-fail-ring{border-color:#ef4444}
.tr-fail-check path{stroke:#ef4444;stroke-dasharray:90;stroke-dashoffset:90}
.tr-fail-check{animation-delay:1.05s}
.tr-title{font-size:25px;font-weight:900;color:#071a3b;margin-top:8px;opacity:0;transform:translateY(8px);animation:trText .45s 1.18s ease forwards}
.tr-subtitle{font-size:14px;color:#64748b;margin-top:8px;line-height:1.6;opacity:0;transform:translateY(8px);animation:trText .45s 1.28s ease forwards}
@keyframes trPlane{0%{opacity:0;transform:translate(-160px,70px) rotate(-12deg) scale(.72)}20%{opacity:1}75%{opacity:1;transform:translate(10px,-15px) rotate(-4deg) scale(1)}100%{opacity:0;transform:translate(20px,-20px) rotate(0) scale(.9)}}
@keyframes trRing{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:scale(1)}}
@keyframes trCheck{0%{opacity:0;transform:scale(.65)}100%{opacity:1;transform:scale(1)}}
@keyframes trCheckPath{to{stroke-dashoffset:0}}
@keyframes trText{to{opacity:1;transform:translateY(0)}}
#reader video{border-radius:18px!important}
#reader__scan_region{min-height:270px!important}
#reader__dashboard_section_csr button{background:#f97316!important;color:#fff!important;border:0!important;border-radius:10px!important;padding:9px 14px!important;font-weight:800!important}
</style>
</head>
<body class="min-h-screen">

<div id="login-view" class="min-h-screen bg-[#06132f] flex items-center justify-center p-5">
  <div class="w-full max-w-md bg-white rounded-3xl p-7 shadow-2xl">
    <div class="text-center mb-7">
      <div class="text-3xl font-black text-[#f97316] tracking-tight">TICKETORA</div>
      <p class="text-slate-500 text-sm mt-2">Contrôle des billets à l'entrée</p>
    </div>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-black text-slate-600 uppercase mb-2">Numéro scanner</label>
        <input id="login-number" required autocomplete="username" class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-orange-500" placeholder="Ex. SCN001">
      </div>
      <div>
        <label class="block text-xs font-black text-slate-600 uppercase mb-2">Mot de passe</label>
        <input id="login-password" required type="password" autocomplete="current-password" class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-orange-500" placeholder="Votre mot de passe">
      </div>
      <div id="login-error" class="hidden text-sm font-bold text-red-600 bg-red-50 rounded-xl p-3"></div>
      <button class="w-full bg-[#f97316] hover:bg-orange-600 text-white font-black py-3.5 rounded-xl transition">
        <i class="fa-solid fa-right-to-bracket mr-2"></i>Se connecter
      </button>
    </form>
  </div>
</div>

<div id="app-view" class="hidden min-h-screen">
  <header class="bg-[#06132f] text-white sticky top-0 z-30 shadow-lg">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div>
        <div class="text-xl font-black text-orange-400">TICKETORA</div>
        <div id="scanner-name" class="text-xs text-slate-300 mt-0.5"></div>
      </div>
      <button id="logout-btn" class="px-3 py-2 rounded-lg bg-white/10 hover:bg-white/15 text-xs font-bold">
        <i class="fa-solid fa-right-from-bracket mr-1"></i>Déconnexion
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-5">
    <section class="bg-white rounded-3xl shadow-sm border border-slate-100 p-5">
      <div class="flex flex-col md:flex-row md:items-end gap-4">
        <div class="flex-1">
          <label class="block text-xs font-black text-slate-500 uppercase mb-2">Événement à contrôler</label>
          <select id="event-select" class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white font-bold outline-none focus:border-orange-500"></select>
        </div>
        <div class="text-xs text-slate-500 md:max-w-xs">
          <i class="fa-solid fa-circle-info text-orange-500 mr-1"></i>
          Le serveur vérifie le billet et empêche qu'un billet déjà utilisé soit accepté une seconde fois.
        </div>
      </div>
    </section>

    <section id="scanner-panel" class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h1 class="font-black text-slate-900 text-lg">Scanner le QR code</h1>
          <p class="text-sm text-slate-500 mt-1">Présentez le billet devant la caméra.</p>
        </div>
        <span class="inline-flex items-center gap-2 text-xs font-black text-emerald-600 bg-emerald-50 px-3 py-2 rounded-full">
          <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>Prêt
        </span>
      </div>
      <div class="p-5">
        <div id="reader" class="max-w-xl mx-auto overflow-hidden rounded-2xl"></div>
        <div class="max-w-xl mx-auto mt-5">
          <div class="relative flex items-center gap-3">
            <div class="h-px bg-slate-200 flex-1"></div><span class="text-xs font-bold text-slate-400">OU</span><div class="h-px bg-slate-200 flex-1"></div>
          </div>
          <form id="manual-form" class="mt-4 flex gap-2">
            <input id="manual-code" class="min-w-0 flex-1 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-orange-500 font-mono uppercase" placeholder="Saisir le code du billet">
            <button class="bg-[#06132f] text-white px-5 rounded-xl font-black">Valider</button>
          </form>
        </div>
      </div>
    </section>

    <section class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h2 class="font-black text-slate-900">Dernières entrées</h2>
          <p class="text-xs text-slate-400 mt-1">Billets validés par ce système.</p>
        </div>
        <button id="refresh-history" class="text-xs font-black text-orange-600">Actualiser</button>
      </div>
      <div id="history" class="divide-y divide-slate-100">
        <div class="p-8 text-center text-sm text-slate-400">Sélectionnez un événement.</div>
      </div>
    </section>
  </main>
</div>

<div id="animation-root" class="hidden"></div>

<script>
const API=(window.TICKETORA_API_URL||'').replace(/\/$/,'');
const $=id=>document.getElementById(id);
let scanner=null, scannerRunning=false, busy=false, currentEventId=null, historyTimer=null;

async function api(path,options={}){
  const r=await fetch(`${API}${path}`,{credentials:'include',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
  let d={}; try{d=await r.json()}catch{}
  if(!r.ok) throw Object.assign(new Error(d.message||'Erreur serveur'),{data:d,status:r.status});
  return d;
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function animationHTML(title,subtitle,success=true){
  const ring=success?'':'tr-fail-ring', check=success?'':'tr-fail-check';
  const path=success?'M14 28 L24 38 L43 17':'M17 17 L39 39 M39 17 L17 39';
  return `<div class="tr-overlay"><div class="tr-card">
    <div class="tr-stage">
      <div class="tr-plane"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M13 48 L84 14 L58 83 L43 55 Z" fill="#f97316"/><path d="M13 48 L84 14 L43 55 Z" fill="#fb923c"/><path d="M43 55 L58 83 L52 52 Z" fill="#ea580c"/></svg></div>
      <div class="tr-ring ${ring}"></div>
      <svg class="tr-check ${check}" viewBox="0 0 60 60" aria-hidden="true"><path d="${path}"></path></svg>
    </div>
    <div class="tr-title">${esc(title)}</div>
    <div class="tr-subtitle">${esc(subtitle)}</div>
  </div></div>`;
}

function playValidationAnimation(title,subtitle,success,done){
  $('animation-root').classList.remove('hidden');
  $('animation-root').innerHTML=animationHTML(title,subtitle,success);
  setTimeout(()=>{ $('animation-root').classList.add('hidden'); $('animation-root').innerHTML=''; done&&done(); },1900);
}

async function login(e){
  e.preventDefault();
  $('login-error').classList.add('hidden');
  try{
    const d=await api('/api/scanners/login',{method:'POST',body:JSON.stringify({number:$('login-number').value.trim(),password:$('login-password').value})});
    $('login-view').classList.add('hidden');
    $('app-view').classList.remove('hidden');
    $('scanner-name').textContent=`${d.scanner?.name||'Agent scanner'} • ${d.scanner?.number||''}`;
    await loadEvents();
  }catch(err){
    $('login-error').textContent=err.message;
    $('login-error').classList.remove('hidden');
  }
}

async function loadEvents(){
  const d=await api('/api/scanners/events');
  const events=d.events||[];
  const sel=$('event-select');
  sel.innerHTML=events.length?events.map(e=>`<option value="${e.id}">${esc(e.title)} — ${new Date(e.date).toLocaleDateString('fr-FR')}</option>`).join(''):'<option value="">Aucun événement</option>';
  if(events.length){currentEventId=Number(events[0].id);sel.value=String(currentEventId);await loadHistory();}
  await startScanner();
}

async function startScanner(){
  if(scannerRunning||!currentEventId||busy)return;
  if(scanner){try{await scanner.stop();}catch{} scanner.clear(); scanner=null;}
  scanner=new Html5Qrcode('reader');
  try{
    const cams=await Html5Qrcode.getCameras();
    if(!cams.length)throw new Error('Aucune caméra disponible.');
    const preferred=cams.find(c=>/back|rear|environment/i.test(c.label))||cams[0];
    await scanner.start(preferred.id,{fps:10,qrbox:{width:250,height:250}},onScanSuccess,()=>{});
    scannerRunning=true;
  }catch(e){
    $('reader').innerHTML=`<div class="p-8 text-center text-sm text-slate-500 bg-slate-50 rounded-2xl"><i class="fa-solid fa-camera-slash text-2xl text-orange-500 mb-3"></i><p class="font-bold">Caméra indisponible</p><p class="mt-1">${esc(e.message||'Autorisez l’accès à la caméra puis rechargez la page.')}</p></div>`;
  }
}

async function pauseScanner(){
  if(scanner&&scannerRunning){try{await scanner.stop();}catch{} scannerRunning=false;}
}

async function onScanSuccess(decodedText){
  if(busy)return;
  busy=true;
  await pauseScanner();
  await validateTicket(decodedText);
}

async function validateTicket(code){
  try{
    const d=await api('/api/scanners/scan',{method:'POST',body:JSON.stringify({code:String(code||'').trim().toUpperCase()})});
    const t=d.ticket||{};
    const name=t.customer_name||'Participant';
    playValidationAnimation('Entrée autorisée',`${name} — billet ${t.ticket_type||'STANDARD'} validé.`,true,async()=>{
      busy=false;
      $('manual-code').value='';
      await loadHistory();
      await startScanner();
    });
  }catch(err){
    const d=err.data||{};
    const title=d.status==='USED'?'Billet déjà utilisé':'Billet non valide';
    const detail=d.status==='USED'?'Ce billet a déjà été utilisé pour une entrée.':(d.message||err.message);
    playValidationAnimation(title,detail,false,async()=>{
      busy=false;
      $('manual-code').value='';
      await startScanner();
    });
  }
}

async function loadHistory(){
  if(!currentEventId)return;
  try{
    const d=await api(`/api/scanners/validated?eventId=${encodeURIComponent(currentEventId)}`);
    const rows=d.tickets||[];
    $('history').innerHTML=rows.slice(0,15).map(t=>`<div class="p-4 flex items-center justify-between gap-3">
      <div><div class="font-black text-sm text-slate-800">${esc(t.customer_name||'Participant')}</div><div class="text-xs text-slate-400 mt-1">${esc(t.ticket_type||'STANDARD')} • ${t.used_at?new Date(t.used_at).toLocaleString('fr-FR'):''}</div></div>
      <span class="text-[11px] font-black text-emerald-600 bg-emerald-50 px-2.5 py-1.5 rounded-full">VALIDÉ</span>
    </div>`).join('')||'<div class="p-8 text-center text-sm text-slate-400">Aucune entrée validée pour le moment.</div>';
  }catch(e){console.error(e);}
}

$('login-form').addEventListener('submit',login);
$('manual-form').addEventListener('submit',async e=>{e.preventDefault();const code=$('manual-code').value.trim();if(!code||busy)return;busy=true;await pauseScanner();await validateTicket(code);});
$('event-select').addEventListener('change',async e=>{currentEventId=Number(e.target.value)||null;await loadHistory();});
$('refresh-history').addEventListener('click',loadHistory);
$('logout-btn').addEventListener('click',async()=>{try{await api('/api/scanners/logout',{method:'POST'});}catch{}location.reload();});

(async function restore(){
  try{
    const d=await api('/api/scanners/me');
    if(d.scanner){
      $('login-view').classList.add('hidden');$('app-view').classList.remove('hidden');
      $('scanner-name').textContent=`${d.scanner.name||'Agent scanner'} • ${d.scanner.agent_number||''}`;
      await loadEvents();
    }
  }catch{}
})();
</script>
</body>
</html>
